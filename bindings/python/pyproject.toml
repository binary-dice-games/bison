[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "bison-abi"
version = "1.0.0"
description = "Python bindings for the bison C++ RMI/serialization framework, over the bison_abi C ABI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Binary Dice Games" }]
keywords = ["bison", "serialization", "rmi", "ctypes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/binary-dice-games/bison"
Repository = "https://github.com/binary-dice-games/bison"
Documentation = "https://github.com/binary-dice-games/bison/blob/main/docs/bindings.md"

[project.optional-dependencies]
test = ["pytest"]

# ─── scikit-build-core ──────────────────────────────────────────────────────
# This package (bindings/python/) doesn't hold the CMakeLists.txt it builds
# from -- that's the repo root two levels up, which also builds the C++
# library, tests, other bindings, etc. `cmake.source-dir` points there, and
# `build.targets` restricts the actual build to just `bison_abi` (the C ABI
# shared library the ctypes wrapper in `bison/_native.py` loads), so `pip
# install` doesn't also compile bison-cli, the test suite, or the other
# language bindings. See the `SKBUILD` branch in the root CMakeLists.txt for
# the install() rule that places the built library inside the `bison`
# package directory, and docs/bindings.md for end-to-end instructions.
[tool.scikit-build]
cmake.source-dir = "../.."
cmake.build-type = "Release"
build.targets = ["bison_abi"]
# Restrict `cmake --install` to the `bison` COMPONENT (the SKBUILD install()
# rule in the root CMakeLists.txt) so vendored dependencies' own install()
# rules (libuv, mbedtls, ...) don't dump their untagged headers/static libs/
# CMake package-config files into the wheel alongside libbison_abi.
install.components = ["bison"]
wheel.packages = ["bison"]
# No CPython C API used (bison_abi is a plain ctypes-loaded shared library,
# not a Python extension module) -- one wheel per platform covers every
# CPython 3.x, instead of scikit-build-core's default of tagging the wheel
# to the interpreter it happened to be built with.
wheel.py-api = "py3"

# No sdist support: an sdist can only package files under this directory
# (bindings/python/), but cmake.source-dir points at the repo root two
# levels up, whose CMakeLists.txt/src/extern/etc. an sdist built here
# can't reach. `pip install` (or `pip install -e`) against a full git
# checkout -- see docs/bindings.md -- builds directly from that checkout's
# working tree instead of from an sdist, so this doesn't block local
# installs; it only means "build a source distribution to publish
# elsewhere" isn't a supported path yet.

[tool.scikit-build.cmake.define]
PACKAGE_TESTS = "OFF"

# `pip install -e` uses scikit-build-core's default editable settings
# (mode="redirect", rebuild=false) deliberately: `editable.rebuild = true`
# reruns `cmake --build` on every import, and since `editable.rebuild_dir`
# is unset, "inplace" mode's rebuild runs that build *in* cmake.source-dir
# -- the repo root two levels up -- which is an in-source CMake build that
# litters the whole repository (CMakeCache.txt, CMakeFiles/, build
# artifacts under examples/, src/, bindings/cpp/, ...) rather than confining
# itself to bindings/python/. `bison/_native.py`'s `_find_library()` scans
# sys.path for the redirect mode's site-packages/bison/libbison_abi.so to
# compensate for the one gap redirect mode leaves (it relocates only .py
# imports back to this source tree, not the compiled library).

# ─── cibuildwheel ──────────────────────────────────────────────────────────
# Produces the pre-built platform wheels published to PyPI, so end users get
# `pip install bison-abi` with no compiler, no CMake, and no submodule
# checkout -- pip only falls back to a source build when no wheel matches.
# `.github/workflows/release-pypi.yml` runs this on a `py-v*` tag.
#
# Because `cmake.source-dir = "../.."`, cibuildwheel must run from the repo
# root (with submodules already checked out) so the whole tree is in the
# build context:
#
#   git submodule update --init --recursive
#   pipx run cibuildwheel --output-dir wheelhouse bindings/python
#
# `wheel.py-api = "py3"` above means one wheel per platform serves every
# CPython 3.8+, so we build against a single interpreter rather than the
# full matrix. bison_abi links libuv and mbedtls statically (root
# CMakeLists.txt forces LIBUV_BUILD_SHARED / USE_SHARED_MBEDTLS_LIBRARY
# off), so the wheel needs no system runtime libraries and no `before-all`.
[tool.cibuildwheel]
build = "cp312-*"
skip = ["*_i686", "*-musllinux_*", "pp*"]
build-verbosity = 1
test-command = "python -c \"import bison, bison.dynamic, bison.rmi\""

[tool.cibuildwheel.linux]
# The default manylinux2014 image ships devtoolset-10 (GCC 10), whose
# libstdc++ lacks `std::bit_cast` and other C++20 library features bison
# uses.  manylinux_2_28 (AlmaLinux 8) provides gcc-toolset-12, which links
# the newer libstdc++/libgcc bits statically -- so the wheel still runs
# against the stock system runtime and gains no dependencies; it only
# raises the glibc floor to 2.28 (RHEL/Debian/Ubuntu 2018+).
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# Apple's libc++ marks all of `std::filesystem` (including
# `std::filesystem::path`, used in bison's server/profiler public headers)
# unavailable below macOS 10.15 -- the filesystem runtime first shipped in
# the platform dylib in 10.15.  cibuildwheel's default deployment target for
# the x86_64 build is 10.13, so bump it here; cibuildwheel auto-clamps the
# arm64 build to 11.0, so this only affects the Intel wheel.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests"]

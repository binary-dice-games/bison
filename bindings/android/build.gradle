// bindings/android/build.gradle -- root project, declares plugin versions
// shared by :bison-lib and :examples:BisonExample. No build logic of its
// own; each module applies the plugins it needs.

plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.20' apply false
}
